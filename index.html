<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Syamsidar ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:20px;
color:white;
overflow-y:auto;
}

.card{
max-width:600px;
width:100%;
padding:30px;
border-radius:25px;
text-align:center;
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
box-shadow:0 0 30px rgba(255,255,255,.15);
position:relative;
margin:20px 0;
}

.hidden{
display:none;
}

.page2{
background:radial-gradient(circle at top,
#4c1d95 0%,
#312e81 40%,
#0f172a 100%);
overflow:hidden;
}

.page2::before{
content:"🌙";
position:absolute;
top:20px;
right:25px;
font-size:65px;
filter:drop-shadow(0 0 15px white);
}

.page2::after{
content:"✨ ✨ ✨";
position:absolute;
top:90px;
left:20px;
font-size:18px;
animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
from{opacity:.3;}
to{opacity:1;}
}

.photo-container{
display:flex;
justify-content:center;
align-items:center;
gap:18px;
flex-wrap:wrap;
margin:30px 0;
}

.photo{
width:180px;
height:180px;
object-fit:cover;
border-radius:18px;
border:5px solid white;
box-shadow:0 10px 30px rgba(0,0,0,.4);
transition:.4s;
}

.photo:hover{
transform:scale(1.05);
}

.photo1{
transform:rotate(-6deg);
animation:floatLeft 4s ease-in-out infinite;
}

.photo2{
transform:rotate(6deg);
animation:floatRight 4s ease-in-out infinite;
}

@keyframes floatLeft{

0%{
transform:translateY(0) rotate(-6deg);
}

50%{
transform:translateY(-15px) rotate(-6deg);
}

100%{
transform:translateY(0) rotate(-6deg);
}

}

@keyframes floatRight{

0%{
transform:translateY(-15px) rotate(6deg);
}

50%{
transform:translateY(0) rotate(6deg);
}

100%{
transform:translateY(-15px) rotate(6deg);
}

}

h1{
font-size:2.2rem;
margin-bottom:10px;
}

button{
margin-top:20px;
padding:14px 28px;
border:none;
border-radius:40px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 20px #ff4d6d;
}

.message-card{
margin-top:20px;
padding:22px;
background:rgba(255,255,255,.12);
border-radius:20px;
backdrop-filter:blur(8px);
line-height:1.8;
text-align:left;
box-shadow:0 0 20px rgba(255,255,255,.15);
}

.signature{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

<script>

function showSurprise(){

    // Sembunyikan halaman pertama
    document.getElementById("page1").classList.add("hidden");

    // Tampilkan halaman kedua
    document.getElementById("page2").classList.remove("hidden");

    // Putar musik
    const musik = document.getElementById("musik");
    musik.volume = 0.7;
    musik.play();

    // Confetti utama
    confetti({
        particleCount:250,
        spread:180,
        startVelocity:45,
        origin:{ y:0.6 }
    });

    // Confetti kiri
    setTimeout(()=>{
        confetti({
            particleCount:120,
            angle:60,
            spread:70,
            origin:{x:0}
        });
    },400);

    // Confetti kanan
    setTimeout(()=>{
        confetti({
            particleCount:120,
            angle:120,
            spread:70,
            origin:{x:1}
        });
    },700);

    // Confetti hujan
    setTimeout(()=>{
        confetti({
            particleCount:180,
            spread:360,
            startVelocity:30,
            ticks:250,
            origin:{y:0}
        });
    },1200);

}

</script>
